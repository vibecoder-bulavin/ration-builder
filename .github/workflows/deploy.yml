name: Деплой на Vercel

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Збір цін"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: vercel-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Перевірити токен
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERCELL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "::error::Додай секрет VERCEL_TOKEN у Settings → Secrets → Actions"; exit 1; fi
      - name: Деплой
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERCELL_TOKEN }}
          VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE || 'frances-avec-vlada' }}
        run: npx --yes vercel@65.14.0 deploy --prod --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_SCOPE"
